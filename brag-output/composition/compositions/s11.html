<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

      <div id="s11-root" data-composition-id="s11" data-width="1920" data-height="1080">
        <div class="scene" id="s11-scene">
          <div id="s11-head">
            <div class="kicker">Layer 4 · stacking</div>
            <div class="h2">Three scores in. One probability out.</div>

          <div class="panel s11-in" id="s11-i1"><div class="nm">rate</div><div class="src">continuous score from Layer 1</div><div class="s11-bar"><i></i></div></div>

          <div id="s11-wo"></div>

            <div id="s11-p">0.00</div>
            <div id="s11-gauge"><div id="s11-gfill"></div><div id="s11-th"></div></div>
            <div id="s11-thl">threshold 0.43</div>

      <script>
        (function () {
          const C = /*CUES*/[0.55, 2.46, 6.12, 7.77, 9.01, 10.59, 12.73, 15.5, 19.9, 22.16];
          const D = /*DUR*/25.436;
          const tl = gsap.timeline({ paused: true });
          const pEl = document.getElementById("s11-p");
          const pv = { v: 0 };
          tl.fromTo("#s11-scene", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo("#s11-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, C[0]);
          tl.fromTo("#s11-node", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, C[1]);
          [["#s11-i1", "#s11-w1", 0.18, C[2]], ["#s11-i2", "#s11-w2", 0.64, C[3]], ["#s11-i3", "#s11-w3", 0.82, C[4]]].forEach(([card, wire, v, t]) => {
            tl.fromTo(card, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t);
            tl.fromTo(card + " .s11-bar i", { scaleX: 0 }, { scaleX: v, duration: 0.8, ease: "power2.out" }, t + 0.3);
            tl.fromTo(wire, { scaleX: 0 }, { scaleX: 1, duration: 0.5 }, t + 0.5);
          });
          tl.fromTo("#s11-wo", { scaleX: 0 }, { scaleX: 1, duration: 0.4 }, C[5] - 0.2);
          tl.fromTo("#s11-out", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, C[5]);
          tl.fromTo("#s11-th", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4 }, C[6]);
          tl.fromTo("#s11-thl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C[6] + 0.2);
          tl.fromTo("#s11-cap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, C[7]);
          tl.fromTo("#s11-gfill", { scaleX: 0 }, { scaleX: 0.91, duration: 2.6, ease: "power2.inOut" }, C[7] + 1.2);
          tl.fromTo(pv, { v: 0 }, { v: 0.91, duration: 2.6, ease: "power2.inOut", onUpdate: () => (pEl.textContent = pv.v.toFixed(2)) }, C[7] + 1.2);
          tl.fromTo("#s11-verdict", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, C[8]);
          tl.fromTo("#s11-banner", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, C[9]);
          tl.to("#s11-scene", { opacity: 0, duration: 0.5, ease: "power2.in" }, D - 0.5);
          window.__timelines["s11"] = tl;
        })();
      </script>
