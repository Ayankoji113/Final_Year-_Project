</defs>
<style>.t{font-size:16px;font-weight:600;fill:#1f2430;text-anchor:middle}.s{font-size:12.5px;fill:#5b6170;text-anchor:middle}.l{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.h{font-size:24px;font-weight:700;fill:#1f2430}.hs{font-size:13.5px;fill:#5b6170}.g{font-size:13px;font-weight:700;fill:#5b6170;letter-spacing:.04em}</style>
<rect width="1600" height="1020" fill="#ffffff"/>
<text x="24" y="36" class="h">MicroAPI Guard — System Architecture</text>
<text x="24" y="58" class="hs">Every arrow is a real data flow in the code. Layer 1 blocks; Layers 2–4 score; the enforcement gate decides what a verdict does.</text>
<rect x="190" y="150" width="1150" height="640" rx="14" fill="#fafbfc" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="545" y="174" class="g">MICROAPI GUARD GATEWAY · FastAPI · port 5000 (the only published port)</text>
<rect x="985" y="330" width="345" height="250" rx="10" fill="none" stroke="#1d5fa8" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1157" y="599" class="g" text-anchor="middle" fill="#1d5fa8" style="fill:#1d5fa8">DETECTOR · LAYERS 2–4</text>
<rect x="20" y="210" width="140" height="360" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="90.0" y="335.5" class="t">Client</text>
<text x="90.0" y="352.5" class="s">users, apps,</text>
<text x="90.0" y="369.5" class="s">attackers</text>
<text x="90.0" y="386.5" class="s"></text>
<text x="90.0" y="403.5" class="s">lab: traffic</text>
<text x="90.0" y="420.5" class="s">generator,</text>
<text x="90.0" y="437.5" class="s">validation</text>
<text x="90.0" y="454.5" class="s">client</text>
<path d="M385,79 a70.0,9 0 0,0 140,0 v44 a70.0,9 0 0,1 -140,0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<ellipse cx="455.0" cy="79" rx="70.0" ry="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="455.0" y="102.0" class="t">Redis</text>
<text x="455.0" y="119.0" class="s">internal, no host port</text>
<rect x="215" y="205" width="140" height="90" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="285.0" y="229.5" class="t">Ingress</text>
<text x="285.0" y="246.5" class="s">body cap 1 MiB</text>
<text x="285.0" y="263.5" class="s">client ID, path</text>
<text x="285.0" y="280.5" class="s">template</text>
<rect x="385" y="205" width="140" height="90" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="1.8"/>
<text x="455.0" y="229.5" class="t">Rate counters</text>
<text x="455.0" y="246.5" class="s">60 s window, 5 s</text>
<text x="455.0" y="263.5" class="s">burst, distinct</text>
<text x="455.0" y="280.5" class="s">endpoints</text>
<rect x="555" y="205" width="140" height="90" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="625.0" y="238.0" class="t">Normalise</text>
<text x="625.0" y="255.0" class="s">decode ×4, HTML,</text>
<text x="625.0" y="272.0" class="s">NFKC, lowercase</text>
<rect x="725" y="205" width="140" height="90" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="1.8"/>
<text x="795.0" y="238.0" class="t">L1 Signatures</text>
<text x="795.0" y="255.0" class="s">26 rules</text>
<text x="795.0" y="272.0" class="s">22 block · 4 flag</text>
<rect x="895" y="205" width="140" height="90" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="1.8"/>
<text x="965.0" y="238.0" class="t">L1 Rate check</text>
<text x="965.0" y="255.0" class="s">&gt; 40 / 5 s or</text>
<text x="965.0" y="272.0" class="s">&gt; 240 / 60 s</text>
<rect x="1110" y="205" width="200" height="90" rx="8" fill="#e9f1fb" stroke="#1d5fa8" stroke-width="1.8"/>
<text x="1210.0" y="238.0" class="t">Feature extraction</text>
<text x="1210.0" y="255.0" class="s">34 shape features,</text>
<text x="1210.0" y="272.0" class="s">standardised</text>
<rect x="1100" y="365" width="100" height="70" rx="8" fill="#e9f1fb" stroke="#1d5fa8" stroke-width="1.8"/>
<text x="1150.0" y="388.0" class="t">L2</text>
<text x="1150.0" y="405.0" class="s">Isolation</text>
<text x="1150.0" y="422.0" class="s">Forest</text>
<rect x="1220" y="365" width="100" height="70" rx="8" fill="#e9f1fb" stroke="#1d5fa8" stroke-width="1.8"/>
<text x="1270.0" y="388.0" class="t">L3</text>
<text x="1270.0" y="405.0" class="s">Auto-</text>
<text x="1270.0" y="422.0" class="s">encoder</text>
<rect x="1000" y="480" width="320" height="85" rx="8" fill="#e9f1fb" stroke="#1d5fa8" stroke-width="1.8"/>
<text x="1160.0" y="510.5" class="t">L4 Meta-learner</text>
<text x="1160.0" y="527.5" class="s">gradient boosting on</text>
<text x="1160.0" y="544.5" class="s">[rate score, L2, L3] → p</text>
<rect x="560" y="470" width="380" height="115" rx="8" fill="#fdeceb" stroke="#b3261e" stroke-width="1.8"/>
<text x="750.0" y="507.0" class="t">Decision &amp; enforcement gate</text>
<text x="750.0" y="524.0" class="s">L1 verdict → block (enforce, enforce-l1)</text>
<text x="750.0" y="541.0" class="s">ML verdict → mode · Redis ok · brake ·</text>
<text x="750.0" y="558.0" class="s">threshold · endpoint list · canary</text>
<rect x="215" y="470" width="240" height="115" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="335.0" y="507.0" class="t">Response to client</text>
<text x="335.0" y="524.0" class="s">403 + layer, reason</text>
<text x="335.0" y="541.0" class="s">413 body too large</text>
<text x="335.0" y="558.0" class="s">backend response + X-Guard headers</text>
<rect x="560" y="690" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="660.0" y="718.0" class="t">Proxy forwarder</text>
<text x="660.0" y="735.0" class="s">httpx, pooled</text>
<text x="660.0" y="752.0" class="s">hop-by-hop stripped</text>
<rect x="800" y="690" width="200" height="80" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="900.0" y="718.0" class="t">Async log writer</text>
<text x="900.0" y="735.0" class="s">queue, batches of 50</text>
<text x="900.0" y="752.0" class="s">sheds when full</text>
<rect x="1060" y="690" width="240" height="80" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="1180.0" y="718.0" class="t">Admin API  /__guard</text>
<text x="1180.0" y="735.0" class="s">health · stats</text>
<text x="1180.0" y="752.0" class="s">reload · brake</text>
<rect x="560" y="850" width="200" height="80" rx="8" fill="#eef7f0" stroke="#2e7d4f" stroke-width="1.8"/>
<text x="660.0" y="878.0" class="t">Backend service</text>
<text x="660.0" y="895.0" class="s">any HTTP API</text>
<text x="660.0" y="912.0" class="s">internal, no host port</text>
<path d="M800,849 a110.0,9 0 0,0 220,0 v80 a110.0,9 0 0,1 -220,0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<ellipse cx="910.0" cy="849" rx="110.0" ry="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="910.0" y="873.0" class="t">Event log</text>
<text x="910.0" y="890.0" class="s">events.jsonl: 34 features,</text>
<text x="910.0" y="907.0" class="s">verdict, hashed client</text>
<text x="910.0" y="924.0" class="s">never raw bodies</text>
<rect x="1060" y="850" width="240" height="80" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
<text x="1180.0" y="878.0" class="t">Security console</text>
<text x="1180.0" y="895.0" class="s">React, 8 pages</text>
<text x="1180.0" y="912.0" class="s">polls every 4–5 s</text>
<rect x="1380" y="690" width="200" height="80" rx="8" fill="#f3edfa" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="1480.0" y="718.0" class="t">Offline training</text>
<text x="1480.0" y="735.0" class="s">train.py  (retrain)</text>
<text x="1480.0" y="752.0" class="s">calibrate.py (threshold)</text>
